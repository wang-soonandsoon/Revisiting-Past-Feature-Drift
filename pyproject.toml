[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chr-core"
version = "0.1.0"
description = "Core algorithms for Cumulative Historical Re-estimation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch==2.8.0"]

[tool.setuptools.packages.find]
include = ["chr_core*"]
