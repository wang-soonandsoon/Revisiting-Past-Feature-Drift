[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chr-core"
version = "0.2.0"
description = "Official implementation of Revisiting Past Feature Drift for Exemplar-Free Class-Incremental Learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch==2.8.0"]

[project.optional-dependencies]
train = [
    "torchvision==0.23.0", "timm==1.0.20", "numpy==1.26.4",
    "Pillow==12.1.1", "safetensors==0.6.2",
]

[tool.setuptools.packages.find]
include = ["chr_core*", "chr_training*"]
